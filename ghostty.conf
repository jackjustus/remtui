# Extra Ghostty settings for the dedicated remtui window (launched by ./rem).
# Loaded on top of your normal ~/.config/ghostty/config, so theme and
# transparency carry over. Only this window loses these Ghostty bindings.

# Let Reminders' ⌘T / ⌘N / ⌘K reach remtui instead of Ghostty.
keybind = super+t=unbind
keybind = super+n=unbind
keybind = super+k=unbind

title = Reminders
window-save-state = never
quit-after-last-window-closed = true
